import java.util.Properties

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseKeyFile = rootProject.file("key.properties")
def releaseKeys = new Properties()
if (releaseKeyFile.isFile()) {
    releaseKeyFile.withInputStream { releaseKeys.load(it) }
}
def readerPreview = providers.gradleProperty("wenkuReaderPreview").orNull == "true"

android {
    namespace = "org.mewx.wenku8_flutter"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "org.mewx.wenku8_flutter.source_preview"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders["wenkuAppLabel"] = "轻小说文库 · 源码预览"
        externalNativeBuild {
            cmake {
                targets.addAll(["mobi", "wenku_mobi"])
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
        }
    }

    if (releaseKeyFile.isFile()) {
        signingConfigs {
            distribution {
                keyAlias = releaseKeys.getProperty("keyAlias")
                keyPassword = releaseKeys.getProperty("keyPassword")
                storeFile = rootProject.file(releaseKeys.getProperty("storeFile"))
                storePassword = releaseKeys.getProperty("storePassword")
            }
        }
    }

    buildTypes {
        release {
            proguardFile(file("document-import.pro"))
            if (readerPreview) {
                applicationIdSuffix = ".reader_preview"
            }
            signingConfig = signingConfigs.getByName(
                (releaseKeyFile.isFile() && !readerPreview) ? "distribution" : "debug"
            )
        }
    }

    def targets = project.findProperty("target-platform")?.toString()
    if (targets != null && project.findProperty("split-per-abi")?.toString()?.toBoolean() != true) {
        def targetAbis = targets.split(",").collect { platform ->
            switch (platform) {
                case "android-arm": return "armeabi-v7a"
                case "android-arm64": return "arm64-v8a"
                case "android-x64": return "x86_64"
                default: throw new GradleException("Unsupported Flutter target platform: ${platform}")
            }
        }
        buildTypes.configureEach {
            ndk.abiFilters.clear()
            ndk.abiFilters.addAll(targetAbis)
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "org.apache.poi:poi-scratchpad:5.5.1"
    implementation "com.github.albfernandez:juniversalchardet:2.0.4"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs_nio:2.1.5"
    implementation "org.jsoup:jsoup:1.23.2"
    implementation "org.commonmark:commonmark:0.30.1"
    implementation "com.tom-roush:pdfbox-android:2.0.27.0"
    implementation "androidx.media:media:1.7.0"
}
