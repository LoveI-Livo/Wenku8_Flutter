name: Build Android APK

on:
  push:
    branches: ['master']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (informational)
        continue-on-error: true
        run: flutter analyze --no-pub || true

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/wenku8-mod-${GITHUB_REF_NAME//\//-}.apk"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wenku8-mod-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            改版安装包（debug 签名，可直接安装）。

            - 版本：${{ github.ref_name }}
            - 源码：https://github.com/${{ github.repository }}
            - 原仓库：https://github.com/mikufoxxx/Wenku8_Flutter

            正式分发请用自己的 keystore 重新签名，详见 docs/BUILD.md。
