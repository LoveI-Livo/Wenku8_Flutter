name: Build packages (manual)

# 手动触发一次，同时产出 Android APK 与 iOS 未签名 IPA。
# 不做自动触发，避免推送即构建。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：填了 tag（如 v0.6.0）就创建 Release 并上传安装包'
        required: false
        type: string

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --android-skip-build-dependency-validation

      - name: Stage artifact
        run: |
          VERSION=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/qingxiaoshuo-wenku-${VERSION}-android.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/wenku8-${VERSION}-universal.apk"
          git archive --format=zip --output="dist/qingxiaoshuo-wenku-${VERSION}-source.zip" HEAD
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: wenku8-mod-android
          path: dist/*
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign || true
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos \
            -derivedDataPath ../build/ios-xcode \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" build
          cd ..
          mkdir -p dist/Payload
          cp -R build/ios-xcode/Build/Products/Release-iphoneos/Runner.app dist/Payload/
          VERSION=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          cd dist && zip -qry "qingxiaoshuo-wenku-${VERSION}-ios-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: wenku8-mod-ios
          path: dist/*.ipa
          if-no-files-found: error

  release:
    needs: [android, ios]
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > "SHA256SUMS-$(awk '/^version:/{print $2}' ../pubspec.yaml | cut -d+ -f1).txt"
          ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: dist/*
          generate_release_notes: false
          body_path: RELEASE-NOTES-0.7.8.md
          make_latest: true
